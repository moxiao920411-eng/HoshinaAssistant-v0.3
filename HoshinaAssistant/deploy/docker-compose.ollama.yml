services:
  backend:
    build:
      context: ../backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      AI_PROVIDER: ollama
      OLLAMA_CHAT_URL: http://ollama:11434/api/chat
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:8b}
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-*}
    depends_on:
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama

  model-pull:
    image: ollama/ollama:latest
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-r1:8b}
    entrypoint: ["/bin/sh", "-c"]
    command: ["sleep 8 && ollama pull \"$${OLLAMA_MODEL}\""]
    depends_on:
      ollama:
        condition: service_started

volumes:
  ollama_data:
